name: check

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # The reasoner tests run HermiT through the OWL API, which needs a JVM.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check semanticlog/ tests/

      - name: Format
        run: uv run ruff format --check semanticlog/ tests/

      - name: Type check
        run: uv run mypy semanticlog/

      - name: Refuse a golden re-baseline
        run: |
          test -z "${SEMLOG_UPDATE_GOLDEN:-}" \
            || { echo "SEMLOG_UPDATE_GOLDEN must not be set in CI"; exit 1; }

      - name: Test
        run: uv run pytest tests/ -q

      - name: Assert the suite actually collected tests
        run: |
          collected=$(uv run pytest tests/ --collect-only -q 2>/dev/null | tail -1 | grep -oE '^[0-9]+')
          echo "collected: ${collected:-0}"
          test "${collected:-0}" -ge 500 \
            || { echo "expected at least 500 tests, collected ${collected:-0}"; exit 1; }

      - name: Build the committed example end to end
        run: uv run semlog build --config examples/pipeline.toml
