name: check

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      # python-version overrides .python-version for every uv command in the job.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # The reasoner tests run HermiT through the OWL API, which needs a JVM.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Lint and type check
        run: make lint typecheck

      # fail_under is set in pyproject.toml.
      - name: Test
        run: uv run pytest -q -n auto --cov=semlog
