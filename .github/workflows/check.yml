name: check

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # uv sync installs the Python version in .python-version.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The reasoner tests run HermiT through the OWL API, which needs a JVM.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Lint and type check
        run: make lint typecheck

      # fail_under is set in pyproject.toml.
      - name: Test
        run: uv run pytest -q -n auto --cov=semanticlog
