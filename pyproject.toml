[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "semlog"
version = "0.7.0"
description = "Convert OCEL 2.0, CSV and XES event logs to OWL 2 ontologies."
authors = [{ name = "Christian Dormagen", email = "christian.dormagen@oth-regensburg.de" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["process mining", "event log", "OCEL", "OWL", "ontology"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "pm4py>=2.7.20",
    "owlapy>=1.6.7,<2",
    # owlapy imports owlready2 without declaring it.
    "owlready2>=0.45",
    "numpy>=1.26",
    "scipy>=1.12,<2",
    "pandas>=3",
    "jpype1>=1.5",
    "ijson>=3.6.0",
]

[project.urls]
Repository = "https://github.com/CronosC/semlog"
Issues = "https://github.com/CronosC/semlog/issues"

[project.scripts]
semlog = "semlog.cli:main"

[project.optional-dependencies]
# [declare] also needs the Lydia solver, built from source. See the README.
declare = [
    "declare4py>=2.2,<3",
    # Replaces lark-parser, which ltlf2dfa pins. Its grammars parse under lark 1.
    "lark>=1.1.5",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    # pytest -n auto
    "pytest-xdist>=3.5",
    "ruff>=0.15",
    "mypy>=2.1",
    "pre-commit>=3",
    # Reads an emitted ontology back as triples, in tests/support/rdf.py.
    "rdflib>=7.6",
]

[tool.uv]
# lark-parser and lark install into the same directory. Only lark is resolved.
override-dependencies = ["lark-parser ; sys_platform == 'never'"]

[tool.setuptools.packages.find]
where = ["."]
include = ["semlog*"]

[tool.setuptools.package-data]
semlog = ["py.typed"]
# The labels and comments a build emits. Read by semlog/onto/annotations.py.
"semlog.onto" = ["tbox_annotations.json", "derived_annotations.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --dist loadgroup"
markers = [
    "slow: runs a subprocess or otherwise takes seconds",
    "reasoner: needs a JVM and the OWL API",
]
filterwarnings = [
    "error",
    # PM4Py advises an optional reader on every XES read. semlog does not depend on it.
    "ignore:Install the optional requirement `r4pm`:UserWarning:pm4py",
    # pm4py.read_xes leaves the file open when the XML does not parse.
    "ignore:unclosed file <_io\\.\\w+ name='[^']*\\.xes':ResourceWarning",
]

[tool.coverage.run]
source = ["semlog"]
branch = true

[tool.coverage.report]
show_missing = true
# Coverage minimum CI enforces. Raise it, do not lower it.
fail_under = 95

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N", "S", "B", "PT", "G", "RUF100"]
ignore = [
    "E501",
    "N806",
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
files = ["semlog"]
ignore_missing_imports = true
warn_unused_ignores = true
