[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semlog"
version = "0.2.0"
description = "Semantic Event Log - Instantiate process mining data as ontologies, with various options"
authors = [
    { name = "Christian Dormagen", email = "christian.dormagen@oth-regensburg.de" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "pm4py>=2.7",
    "declare4py",
    "pandas>=2.2"
]

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
where = ["."]