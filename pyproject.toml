[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semlog"
version = "0.6.0"
description = "Convert OCEL 2.0, CSV and XES event logs to OWL 2 ontologies."
authors = [{ name = "Christian Dormagen", email = "christian.dormagen@oth-regensburg.de" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "pm4py>=2.7",
    "owlapy>=1.6,<2",
    "owlready2>=0.40,<0.51",
    "scipy<2",
    "pandas>=2.2",
]

[project.scripts]
semlog = "semanticlog.cli:main"

[project.optional-dependencies]
# [declare] also needs the Lydia solver, built from source. See the README.
declare = [
    "declare4py",
    # Replaces lark-parser, which ltlf2dfa pins. Its grammars parse under lark 1.
    "lark>=1.1.5",
]
dev = [
    "pytest",
    "pytest-cov",
    # pytest -n auto
    "pytest-xdist",
    "ruff",
    "mypy",
    "pre-commit",
    # Reads an emitted ontology back as triples, in tests/support/ontology.py.
    "rdflib",
]

[tool.uv]
# lark-parser and lark install into the same directory. Only lark is resolved.
override-dependencies = ["lark-parser ; sys_platform == 'never'"]

[tool.setuptools.packages.find]
where = ["."]
include = ["semanticlog*"]

[tool.setuptools.package-data]
semanticlog = ["py.typed"]
# The labels and comments a build emits. Read by semanticlog/onto/annotations.py.
"semanticlog.onto" = ["tbox_annotations.json", "derived_annotations.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: runs a subprocess or otherwise takes seconds",
    "reasoner: needs a JVM and the OWL API",
]
filterwarnings = [
    "error::DeprecationWarning",
    # Third-party.
    "default::DeprecationWarning:pm4py.*",
    "default::DeprecationWarning:owlready2.*",
    "default::DeprecationWarning:pkg_resources.*",
    "default::DeprecationWarning:importlib.*",
]

[tool.coverage.run]
source = ["semanticlog"]
branch = true

[tool.coverage.report]
show_missing = true
# Coverage minimum CI enforces. Raise it, do not lower it.
fail_under = 90

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N", "S", "B", "PT", "G"]
ignore = [
    "E501",
    "N802",
    "N803",
    "N806",
    "UP042",
    "S311",   # no cryptographic randomness here
    "PT011",  # broad pytest.raises
]

[tool.ruff.lint.per-file-ignores]
# S314: the tests parse ontology files they wrote themselves, not untrusted input.
"tests/**" = ["S101", "S108", "S314"]

[tool.mypy]
python_version = "3.12"
files = ["semanticlog"]
ignore_missing_imports = true
warn_unused_ignores = true
