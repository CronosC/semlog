[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semlog"
version = "0.4.0"
description = "Convert OCEL process mining event logs to OWL 2 ontologies. The [declare] extra requires the Lydia solver (not on PyPI) — see README."
authors = [{ name = "Christian Dormagen", email = "christian.dormagen@oth-regensburg.de" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "pm4py>=2.7",
    "owlapy>=1.6,<2",
    "scipy<2",
    "pandas>=2.2",
    # Parquet engine for OCEDStore.write/read. Chosen over CSV so the stored
    # dtypes come back exactly as written, without a schema-guessing step.
    "pyarrow>=15",
]

[project.scripts]
semlog = "semanticlog.cli:main"

[project.optional-dependencies]
# Note: [declare] also requires the Lydia LTLf/LDLf solver (not on PyPI).
# Install it separately with: sudo bash scripts/install_lydia.sh
declare = [
    "declare4py",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["semanticlog*"]

[tool.setuptools.package-data]
semanticlog = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["semanticlog"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N"]
ignore = ["E501", "N802", "N803", "N806", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
files = ["semanticlog"]
ignore_missing_imports = true
warn_unused_ignores = true
