# A complete example. Its input ships with the test suite, so `semlog build --config examples/pipeline.toml` runs from a fresh clone.
# It writes examples/out/pipeline.ofn in OWL functional syntax, or examples/out/pipeline.owl in RDF/XML with streaming = false.

input = "tests/fixtures/pipeline.jsonocel"
output = "examples/out"

profile = "OWL2DL"
# df: directly-follows between adjacent events of a case.
order_representations = ["df"]
# Object type whose instances are the cases. 'semlog inspect' lists them.
case_concepts = ["order"]

attribute_representations = ["individuals"]
# axiomatic: declare each inverse property with an InverseObjectProperties axiom.
inverse_representations = ["axiomatic"]
# Write rdfs:label and rdfs:comment from the names in the log.
derive_annotations = true

# true runs the reasoner after the build. `semlog reason examples/out/pipeline.ofn` runs it separately.
materialize = false
